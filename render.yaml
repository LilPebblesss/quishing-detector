services:
  - type: web
    name: quishing-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: VIRUSTOTAL_API_KEY
        sync: false   # въвеждаш го ръчно в Render dashboard
